apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: proyecto-devops-hpa
  namespace: devops-staging
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: proyecto-devops
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70

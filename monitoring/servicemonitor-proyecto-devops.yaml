apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: proyecto-devops-servicemonitor
  namespace: monitoring
  labels:
    release: prom
spec:
  jobLabel: app
  namespaceSelector:
    matchNames:
      - devops-staging
  selector:
    matchLabels:
      app: proyecto-devops
  endpoints:
    - port: http
      path: /actuator/prometheus
      interval: 15s